<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Basketball court lines (decorative) -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  <circle cx="600" cy="315" r="150" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  
  <!-- Large Basketball Icon -->
  <circle cx="300" cy="315" r="120" fill="#ff6b35" stroke="#000" stroke-width="4"/>
  <path d="M 180 315 Q 300 255, 420 315" stroke="#000" stroke-width="6" fill="none"/>
  <path d="M 180 315 Q 300 375, 420 315" stroke="#000" stroke-width="6" fill="none"/>
  <line x1="300" y1="195" x2="300" y2="435" stroke="#000" stroke-width="6"/>
  
  <!-- Main Title -->
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ff6b35">BASKETBALL</text>
  <text x="500" y="370" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff">LEGENDS 2020</text>
  
  <!-- Subtitle -->
  <text x="500" y="430" font-family="Arial, sans-serif" font-size="32" fill="#cccccc">Play Free Unblocked Games Online</text>
</svg>
